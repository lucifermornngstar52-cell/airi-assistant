name: airi_assistant
description: AIRI AI Assistant — dark UI, dual personas, GPT-4o-mini
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
  permission_handler: ^12.0.0
  flutter_tts: ^4.2.5
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.2.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/live2d_viewer.html
    - assets/models/Hiyori/
    - assets/models/Hiyori/motions/
    - assets/models/Hiyori/Hiyori.2048/
    - assets/models/Natori/
    - assets/models/Natori/motions/
    - assets/models/Natori/exp/
    - assets/models/Natori/Natori.2048/
    - assets/live2d/
  assets:
    - assets/live2d_viewer.html
    - assets/live2d/
    - assets/models/